name: Refresh MCP settings manifest
on:
  push:
    branches: [feature/unified-mcp-settings]
permissions:
  contents: write
jobs:
  refresh:
    if: contains(github.event.head_commit.message, '[refresh-manifest]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unified-mcp-settings
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Refresh delivery manifest without shipping this helper
        shell: bash
        run: |
          rm .github/workflows/refresh-mcp-settings-manifest.yml
          cd engineering/code
          node scripts/refresh-manifest.mjs
      - name: Commit refreshed manifest and helper removal
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: refresh engineering manifest for MCP settings'
          git push origin HEAD:feature/unified-mcp-settings
