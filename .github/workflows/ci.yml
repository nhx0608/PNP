name: PNP shared-contract checks
on:
  pull_request:
  # Work now lands on master directly, so a push there must run the same gate a PR would:
  # a master that no CI has seen is a master nobody has verified on Linux.
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  shared-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # The whole gate takes about three minutes; a job past this is hung, and a hung job must fail
    # with its log released rather than hold the runner for hours.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: engineering/code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci
      - name: Exercise Windows one-command bootstrap with explicit engine selection
        if: runner.os == 'Windows'
        shell: cmd
        run: pnp.cmd bootstrap --engine mock
      - run: npm run foundation:check
      - run: npm run build

  # End-to-end smoke: real gateway process, real engine, real north-bound HTTP.
  # The model service is the only mocked component.
  engine-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Control group: proves the harness itself, with no real engine involved.
          - os: ubuntu-latest
            engine: mock
          # Fast real-engine signal.
          - os: ubuntu-latest
            engine: opencode
          - os: ubuntu-latest
            engine: pi
          - os: windows-latest
            engine: mock
          # The legs that count: the competition target platform, both required engines.
          - os: windows-latest
            engine: opencode
          - os: windows-latest
            engine: pi
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: engineering/code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci
      - run: npm run build
      - name: Install OpenCode
        if: matrix.engine == 'opencode'
        run: npm install -g opencode-ai@1.18.29 --loglevel=error
      - name: Report OpenCode version
        if: matrix.engine == 'opencode'
        run: opencode --version
      # Pi has no native binary: the launch target is the package's own Node entry script, and a
      # global install only leaves a .cmd shim on Windows, which the shared ProcessHost refuses to
      # spawn. --ignore-scripts matches how the offline bundle installs it. The pair the driver
      # reads is exported here so the smoke runs against a known entry rather than a guess.
      - name: Install Pi
        if: matrix.engine == 'pi'
        run: npm install -g @earendil-works/pi-coding-agent@0.85.1 --ignore-scripts --loglevel=error
      - name: Locate Pi and report its version (POSIX)
        if: matrix.engine == 'pi' && runner.os != 'Windows'
        run: |
          entry="$(npm root -g)/@earendil-works/pi-coding-agent/dist/bundle/cli.js"
          node "$entry" --version
          echo "PNP_PI_ENTRY=$entry" >> "$GITHUB_ENV"
          echo "PNP_PI_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - name: Locate Pi and report its version (Windows)
        if: matrix.engine == 'pi' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $entry = Join-Path (npm root -g) '@earendil-works\pi-coding-agent\dist\bundle\cli.js'
          & node $entry --version
          "PNP_PI_ENTRY=$entry" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PNP_PI_NODE=$((Get-Command node).Source)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # The one-command launcher's engine install path (npm install into the runtime cache, then the
      # engine's own --version) has no other CI evidence. PNP_PI_ENTRY is cleared for this step on
      # purpose: with it set the launcher would take the explicit-variable shortcut and never reach
      # the installer. This step needs config/engines/pi.json to declare its locked npm-node-entry
      # distribution; while it does not, the launcher fails here by design and says so.
      - name: Exercise the one-command bootstrap's engine install path
        if: matrix.engine != 'mock' && runner.os == 'Windows'
        shell: cmd
        env:
          PNP_PI_ENTRY: ''
          PNP_PI_NODE: ''
        run: pnp.cmd bootstrap --engine ${{ matrix.engine }}
      # The judge-facing verification step from INSTRUCTION.md, end to end: bootstrap, then the same
      # smoke harness through the launcher. The harness puts the mock engine's gateway into
      # development mode itself, so no environment is set here.
      - name: Exercise the launcher's self-check
        if: matrix.engine == 'mock' && runner.os == 'Windows'
        shell: cmd
        run: pnp.cmd selfcheck --engine mock
      - name: Run engine smoke
        run: node scripts/e2e/ci-smoke.mjs --engine ${{ matrix.engine }} --artifacts ${{ runner.temp }}/e2e-artifacts
      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.os }}-${{ matrix.engine }}
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: warn
          retention-days: 7
