# Temporary self-cleaning helper; removed by its own job.
name: Refresh engineering manifest
on:
  push:
    branches: [feature/model-settings]
permissions:
  contents: write
jobs:
  refresh:
    if: contains(github.event.head_commit.message, '[refresh-manifest]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/model-settings
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Refresh delivery manifest without shipping this helper
        shell: bash
        run: |
          rm .github/workflows/refresh-engineering-manifest.yml
          cd engineering/code
          node scripts/refresh-manifest.mjs
      - name: Commit refreshed manifest and helper removal
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/refresh-engineering-manifest.yml engineering/FILE-MANIFEST.json engineering/SHA256SUMS.txt engineering/REVIEW-INDEX.md
          git commit -m 'chore: refresh engineering manifest'
          git push origin HEAD:feature/model-settings
