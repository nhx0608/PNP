name: Refresh branch engineering manifest
on:
  push:
    branches: [feature/one-command-local-start]
permissions:
  contents: write
jobs:
  refresh:
    if: contains(github.event.head_commit.message, '[refresh-manifest]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/one-command-local-start
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Remove temporary workflow before manifest generation
        run: rm .github/workflows/refresh-branch-manifest.yml
      - name: Refresh engineering manifest
        working-directory: engineering/code
        run: node scripts/refresh-manifest.mjs
      - name: Commit refreshed manifest and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/refresh-branch-manifest.yml engineering/FILE-MANIFEST.json engineering/SHA256SUMS.txt engineering/REVIEW-INDEX.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: refresh engineering manifest'
          git push origin HEAD:feature/one-command-local-start
